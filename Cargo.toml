[package]
name = "pcap-match"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version="4.6.7", features=["derive", "env", "deprecated"] }
itertools = "0.15.0"
jiff = "1.0.0"
libc = "0.2.191"
pcap = "2.5.0"
pnet = "0.35.0"

[build-dependencies]
cc = { version = "1.11.2", optional = true }
cmake = { version = "0.1.58", optional = true }
pkg-config = { version = "0.3.34", optional = true }

[features]
static = ["dep:pkg-config", "dep:cc", "dep:cmake"]
